<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Callboard</title>
<meta name="description" content="Callboard: schedule production volunteers per event. Import form responses from email, PDF or CSV.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --bg: #f5f5f7; --surface: #ffffff; --surface-2: #ececf0;
  --ink: #1d2026; --ink-2: #5b606b; --line: #d9dbe1;
  --pine: #2d4a9e; --pine-ink: #ffffff; --pine-soft: #dfe5f6;
  --amber: #b9791a; --amber-soft: #f6e8cc;
  --berry: #9a2a3e; --berry-soft: #f5dde1;
  --focus: #2d4a9e;
  --serif: var(--sans);
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14161b; --surface: #1c1f26; --surface-2: #252932;
    --ink: #eceef2; --ink-2: #a2a8b5; --line: #343945;
    --pine: #93a9f2; --pine-ink: #101631; --pine-soft: #222c52;
    --amber: #e3a948; --amber-soft: #3a2f16;
    --berry: #ee8a9b; --berry-soft: #3d1f26; --focus: #93a9f2;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161b; --surface: #1c1f26; --surface-2: #252932;
  --ink: #eceef2; --ink-2: #a2a8b5; --line: #343945;
  --pine: #93a9f2; --pine-ink: #101631; --pine-soft: #222c52;
  --amber: #e3a948; --amber-soft: #3a2f16;
  --berry: #ee8a9b; --berry-soft: #3d1f26; --focus: #93a9f2;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button, select, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 72px; }
h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(28px, 5vw, 42px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; }
h2 { font-family: var(--serif); font-weight: 700; margin: 0; }
.sub { color: var(--ink-2); margin-top: 6px; }
.hint { color: var(--ink-2); font-size: 13px; margin: 10px 0 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--pine); color: var(--pine-ink); border-color: var(--pine); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--berry); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
.spacer { flex: 1; }

/* home */
.home-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 24px; }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.pcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; cursor: pointer; display: block; width: 100%; }
.pcard:hover { border-color: var(--pine); }
.pcard h2 { font-size: 22px; margin-bottom: 4px; }
.pcard .kind { color: var(--ink-2); font-size: 13px; }
.pcard .stats { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.pcard .stats strong { display: block; font-size: 20px; color: var(--ink); font-family: var(--serif); }
.pbar { height: 6px; background: var(--surface-2); border-radius: 99px; margin-top: 14px; overflow: hidden; }
.pbar span { display: block; height: 100%; background: var(--pine); }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--ink-2); }

/* project header */
.back { background: none; border: 0; padding: 0; color: var(--ink-2); cursor: pointer; margin-bottom: 10px; }
.back:hover { color: var(--ink); }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.meter { min-width: 220px; }
.meter-label { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 12px; }
.meter-label strong { color: var(--ink); font-weight: 600; }
.meter-bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter-bar > span { display: block; height: 100%; background: var(--pine); transition: width .25s ease; }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
nav.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); }

.alerts { display: grid; gap: 8px; margin-bottom: 16px; }
.alert { border-left: 4px solid var(--amber); background: var(--amber-soft); padding: 10px 12px; border-radius: 0 8px 8px 0; }
.alert.bad { border-left-color: var(--berry); background: var(--berry-soft); }

/* schedule */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.shifts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 700px) { .shifts { grid-template-columns: 1fr; } }
.shift { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.shift-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.shift-head h2 { font-size: 19px; }
.shift-head .when { color: var(--ink-2); font-size: 13px; }
.shift-head .fill { font-size: 13px; font-weight: 600; color: var(--pine); white-space: nowrap; }
.shift-head .fill.low { color: var(--amber); }
.row { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row label { font-weight: 500; font-size: 14px; }
.row select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.row.filled select { background: var(--pine-soft); border-color: transparent; font-weight: 500; }
.row.conflict select { background: var(--berry-soft); border-color: var(--berry); }
.row .none { font-size: 12px; color: var(--berry); grid-column: 2; margin-top: -4px; }
aside.counts { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; position: sticky; top: 12px; }
aside.counts h3 { font-family: var(--serif); font-size: 17px; margin: 0 0 10px; }
.count-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 5px 0; align-items: center; }
.count-row .bar { grid-column: 1 / -1; height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.count-row .bar span { display: block; height: 100%; background: var(--amber); }
.count-row .n { font-variant-numeric: tabular-nums; font-weight: 600; }
.count-row .n.zero { color: var(--ink-2); font-weight: 400; }
.count-row .n.over { color: var(--berry); }

/* volunteers */
.search { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 200px; }
.vols { display: grid; gap: 12px; }
.vol { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.vol-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.vol-top .name { flex: 1; min-width: 180px; font-weight: 600; font-size: 16px; }
.vol-line { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: start; }
@media (max-width: 600px) { .vol-line { grid-template-columns: 1fr; gap: 4px; } }
.lbl { color: var(--ink-2); font-size: 13px; padding-top: 6px; }
.txt, .num, .sel { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
input.name { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; }
input.name:hover { border-color: var(--line); }
input.name:focus { border-color: var(--pine); background: var(--bg); }
.num { width: 64px; }
.limit { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 4px 11px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.chip:hover { border-color: var(--pine); }
.chip[aria-pressed="true"] { background: var(--pine-soft); border-color: transparent; color: var(--ink); font-weight: 600; }
.chip[aria-pressed="true"]::before { content: "\2713\00a0"; }
.chips.amber .chip[aria-pressed="true"] { background: var(--amber-soft); }
.pair { display: flex; flex-wrap: wrap; gap: 8px; }
.pair .txt { flex: 1; min-width: 180px; }
.remove { background: none; border: 0; color: var(--berry); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.remove:hover { background: var(--berry-soft); }

/* setup */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 19px; margin-bottom: 10px; }
.field { display: grid; gap: 4px; margin-bottom: 10px; max-width: 420px; }
.field span { font-size: 13px; color: var(--ink-2); }
.srow { display: grid; grid-template-columns: 1.3fr 1fr 1.1fr .8fr 1.2fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
@media (max-width: 800px) { .srow { grid-template-columns: 1fr 1fr; } }
.shead { font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.table-scroll { overflow-x: auto; }
table.pos { border-collapse: collapse; width: 100%; min-width: 560px; }
table.pos th, table.pos td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line); font-weight: 400; }
table.pos th { font-size: 12.5px; color: var(--ink-2); }
table.pos th:first-child, table.pos td:first-child { text-align: left; }
table.pos input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--pine); }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 20, .55); z-index: 30; display: grid; place-items: start center; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 820px; padding: 22px; border: 1px solid var(--line); }
.modal h2 { font-size: 24px; margin-bottom: 4px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.dz { display: grid; gap: 8px; place-items: center; text-align: center; border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px; margin: 16px 0; color: var(--ink-2); }
.dz strong { color: var(--ink); font-family: var(--serif); font-size: 18px; }
.dz.over { border-color: var(--pine); background: var(--pine-soft); }
textarea.paste { width: 100%; min-height: 120px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; }
.draft { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; display: grid; gap: 10px; }
.draft.skipped { opacity: .5; }
.draft-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.draft-head .name { flex: 1; min-width: 180px; font-weight: 600; font-size: 16px; border-color: var(--line); background: var(--bg); }
.draft-head .name.missing { border-color: var(--berry); background: var(--berry-soft); }
.badge { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--pine-soft); }
.badge.upd { background: var(--amber-soft); }
.src { font-size: 12.5px; color: var(--ink-2); }
.warn { font-size: 13px; color: var(--berry); }
.errs { display: grid; gap: 6px; margin-top: 12px; }

.drop-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(45, 74, 158, .88); display: grid; place-items: center; color: #fff; text-align: center; pointer-events: none; }
.drop-overlay div { display: grid; gap: 6px; }
.drop-overlay strong { font-family: var(--serif); font-size: 32px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; display: flex; gap: 14px; align-items: center; z-index: 50; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: var(--amber); cursor: pointer; font-weight: 600; padding: 0; }

@media print {
  body::before, nav.tabs, .toolbar, aside.counts, .toast, .alerts, .back { display: none !important; }
  .layout { display: block; }
  .shift { break-inside: avoid; }
  body { background: #fff; color: #000; }
  .row select { appearance: none; border: 0; background: none; padding: 0; font-weight: 600; }
}
@media (prefers-reduced-motion: reduce) { .meter-bar > span { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modalRoot"></div>
<div class="drop-overlay" id="dropOverlay" hidden><div><strong>Drop volunteer emails here</strong><span>.eml, PDF or CSV files, or selected text</span></div></div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function () {
  "use strict";

  /* ================= parsing (pure functions) ================= */
  /*PARSE-START*/
  var GROUPS = [
    { id: "stationary", name: "Stationary camera", short: "Stationary" },
    { id: "wireless",   name: "Wireless camera",   short: "Wireless" },
    { id: "dolly",      name: "Dolly camera",      short: "Dolly" },
    { id: "jib",        name: "Jib camera",        short: "Jib" },
    { id: "shading",    name: "Shading",           short: "Shading" },
    { id: "lyrics",     name: "Lyrics",            short: "Lyrics" },
    { id: "ppt",        name: "PPT",               short: "PPT" }
  ];
  var GROUP_KW = {
    stationary: /stationary/i, wireless: /wireless/i, dolly: /dolly/i, jib: /\bjib\b/i,
    shading: /shad(e|ing|er)/i, lyrics: /lyric/i, ppt: /\bppt\b|power ?point/i
  };
  function groupId(text) {
    var best = "", bi = 1e9;
    GROUPS.forEach(function (g) {
      var m = GROUP_KW[g.id].exec(text);
      if (m && m.index < bi) { bi = m.index; best = g.id; }
    });
    return best;
  }

  function utf8(bytes, cs) {
    try { return new TextDecoder(cs || "utf-8").decode(bytes); } catch (e) { return new TextDecoder("utf-8").decode(bytes); }
  }
  function qpBytes(s) {
    s = s.replace(/=\r?\n/g, "");
    var out = [];
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (c === "=" && /^[0-9A-Fa-f]{2}$/.test(s.substr(i + 1, 2))) { out.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
      else out.push(s.charCodeAt(i) & 255);
    }
    return new Uint8Array(out);
  }
  function b64Bytes(s) {
    var bin = atob(s.replace(/[^A-Za-z0-9+\/=]/g, ""));
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function decodeWords(s) {
    return String(s || "").replace(/(\?=)\s+(=\?)/g, "$1$2").replace(/=\?([^?]+)\?([bBqQ])\?([^?]*)\?=/g, function (_, cs, enc, txt) {
      try {
        return enc.toUpperCase() === "B" ? utf8(b64Bytes(txt), cs) : utf8(qpBytes(txt.replace(/_/g, " ")), cs);
      } catch (e) { return txt; }
    });
  }
  function htmlToText(html) {
    html = String(html || "").replace(/<(style|script|head)[\s\S]*?<\/\1>/gi, "")
      .replace(/<(br|\/p|\/div|\/tr|\/li|\/h[1-6]|\/table|\/td)\b[^>]*>/gi, "\n");
    if (typeof DOMParser !== "undefined") {
      return new DOMParser().parseFromString(html, "text/html").body.textContent || "";
    }
    return html.replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&");
  }
  function parseMime(raw) {
    var m = raw.match(/\r?\n\r?\n/);
    var idx = m ? m.index : raw.length;
    var head = raw.slice(0, idx).replace(/\r?\n[ \t]+/g, " ");
    var body = m ? raw.slice(idx + m[0].length) : "";
    var h = {};
    head.split(/\r?\n/).forEach(function (l) {
      var k = l.indexOf(":");
      if (k > 0) { var key = l.slice(0, k).toLowerCase(); if (!(key in h)) h[key] = l.slice(k + 1).trim(); }
    });
    var ct = h["content-type"] || "text/plain";
    var type = ct.split(";")[0].trim().toLowerCase();
    var cs = (ct.match(/charset="?([^";\s]+)/i) || [])[1];
    var cte = (h["content-transfer-encoding"] || "").toLowerCase();
    if (type.indexOf("multipart/") === 0) {
      var b = (ct.match(/boundary="?([^";]+)"?/i) || [])[1];
      var parts = b ? body.split("--" + b).slice(1) : [];
      var plain = "", html = "";
      parts.forEach(function (p) {
        if (/^--/.test(p.trim())) return;
        var r = parseMime(p.replace(/^\r?\n/, ""));
        if (r.plain) plain += r.plain + "\n";
        if (r.html) html += r.html + "\n";
      });
      return { h: h, plain: plain, html: html };
    }
    var text;
    try {
      if (cte === "base64") text = utf8(b64Bytes(body), cs);
      else if (cte === "quoted-printable") text = utf8(qpBytes(body), cs);
      else text = body;
    } catch (e) { text = body; }
    if (type === "text/html") return { h: h, plain: "", html: text };
    if (type === "text/plain") return { h: h, plain: text, html: "" };
    return { h: h, plain: "", html: "" };
  }
  function looksLikeEml(t) {
    return /^\s*(received|return-path|from|date|subject|mime-version|delivered-to|message-id|content-type|x-[a-z-]+):/i.test(t.slice(0, 400)) && /\r?\n\r?\n/.test(t);
  }
  function looksLikeHtml(t) { return /^\s*<(!doctype|html|body|div|table|p|span)\b/i.test(t); }

  var HEADS = [
    { k: "avail",    re: /what (shifts|sessions) are you available/i },
    { k: "count",    re: /how many (shifts|sessions) are you willing/i },
    { k: "roles",    re: /roles that i have been trained in/i },
    { k: "interest", re: /roles that i am interested in/i },
    { k: "p1",       re: /first preference for a role/i },
    { k: "p2",       re: /second preference for a role/i },
    { k: "p3",       re: /third preference for a role/i },
    { k: "partial",  re: /if you are not able to serve/i },
    { k: "notes",    re: /what else (do you want us to know|should i know)/i },
    { k: "shirt",    re: /t-?shirt size/i },
    { k: "staff",    re: /staff role or volunteer role/i }
  ];
  var WORDNUM = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 };

  function cleanName(n) {
    n = String(n || "").replace(/["<>]/g, "").replace(/\s+/g, " ").trim();
    if (!n || /planning center|no-?reply|notification|forms?\b|mailer|@/i.test(n)) return "";
    return n;
  }

  // meta: {from, subject}; shifts: [{id, key}]
  function parseResponse(text, meta, shifts) {
    meta = meta || {};
    var lines = String(text || "").replace(/\u00a0/g, " ").split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var sections = {}, cur = null, found = 0, firstHead = lines.length;
    lines.forEach(function (line, i) {
      var hit = null;
      for (var j = 0; j < HEADS.length; j++) if (HEADS[j].re.test(line)) { hit = HEADS[j]; break; }
      if (hit) {
        cur = hit.k; found++;
        if (i < firstHead) firstHead = i;
        sections[cur] = sections[cur] || [];
        var q = line.lastIndexOf("?");
        var rest = q >= 0 ? line.slice(q + 1).trim() : "";
        if (rest && !/^\*$/.test(rest)) sections[cur].push(rest);
        return;
      }
      if (!cur) return;
      if (/^\(.*[\):]$/.test(line) || /^only check the box/i.test(line) || /^list dates and times/i.test(line) || /^\*$/.test(line)) return;
      sections[cur].push(line.replace(/^[\u2022\u00b7*\-\u2013\u2713\u2611]\s*/, ""));
    });

    var d = { name: "", email: "", avail: {}, quals: {}, interest: {}, willing: null, prefs: ["", "", ""], partial: "", notes: "", unmatched: [], found: found };

    // availability
    (sections.avail || []).forEach(function (line) {
      var low = line.toLowerCase().replace(/\s+/g, " ");
      var hit = false;
      shifts.forEach(function (s) {

  function parseCsv(text) {

      if (have.wireless) positions.push(mkPos("c5", "Camera 5 (WL)", "wireless"), mkPos("c6", "Camera 6 (WL)", "wireless"));
      if (have.jib) positions.push(mkPos("jib", "Jib", "jib"));
      if (have.shading) positions.push(mkPos("shade", "Shading", "shading"));
      if (have.lyrics) positions.push(mkPos("lyr", "Lyrics", "lyrics"));
      if (have.ppt) positions.push(mkPos("ppt", "PPT", "ppt"));
    }
    return { shifts: shifts, positions: positions, count: rows.length - 1 };
  }
  var pdfLib = null;
  function loadPdfJs() {
    if (pdfLib) return pdfLib;
    pdfLib = new Promise(function (resolve, reject) {
      if (window.pdfjsLib) { resolve(window.pdfjsLib); return; }
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = function () {
        if (!window.pdfjsLib) { reject(new Error("missing")); return; }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        resolve(window.pdfjsLib);
      };
      s.onerror = function () { reject(new Error("load")); };
      document.head.appendChild(s);
    });
    pdfLib.catch(function () { pdfLib = null; });
    return pdfLib;
  }
  async function pdfToText(file) {
    var lib = await loadPdfJs();
    var doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
    var out = "";
    for (var n = 1; n <= doc.numPages; n++) {
      var page = await doc.getPage(n), tc = await page.getTextContent(), lastY = null, line = "";
      tc.items.forEach(function (it) {
        var y = it.transform ? it.transform[5] : 0;
        if (lastY !== null && Math.abs(y - lastY) > 3) { out += line.trim() + "\n"; line = ""; }
        line += it.str; lastY = y;
        if (it.hasEOL) { out += line.trim() + "\n"; line = ""; lastY = null; }
      });
      out += line.trim() + "\n";
    }
    return out;
  }
  async function readFiles(files) {
    var out = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try {
        if (/\.csv$/i.test(f.name) || f.type === "text/csv") { out = out.concat(csvSources(await f.text(), f.name)); }
        else if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") {
          try { out.push({ name: f.name, text: await pdfToText(f) }); }
          catch (pe) { out.push({ name: f.name, text: "", error: "couldn’t read this PDF here. Paste its text instead." }); }
        } else out.push({ name: f.name, text: await f.text() });
      } catch (e) { /* skip unreadable file */ }
    }
    ingest(out);
  }

  /* ================= events ================= */
  var app = document.getElementById("app");

  app.addEventListener("click", function (e) {
    var t = e.target, P = cur();
    var open = t.closest("[data-open]");
    if (open) { store.current = open.getAttribute("data-open"); tab = "schedule"; save(); render(); return; }
    if (t.closest("#newProject")) { newProjectModal(); return; }
    if (t.closest("#backHome")) { store.current = null; save(); render(); return; }
    if (t.closest("#backupAll")) { saveFile("callboard-backup.json", JSON.stringify(store, null, 2)); return; }
    var tb = t.closest("nav.tabs button");
    if (tb) { tab = tb.getAttribute("data-tab"); renderTab(); return; }
    if (!P) return;

    if (t.closest("#autofill")) { autofill(); return; }
    if (t.closest("#clearAll")) {
      var n = Object.keys(P.assign).length;
      if (!n) { toast("There’s nothing to clear."); return; }
      var snap = snapshot(); P.assign = {}; save(); renderSchedule(); toast("Cleared " + n + " assignment" + (n > 1 ? "s" : "") + ".", snap); return;
    }
    if (t.closest("#exportCsv")) { exportCsv(); return; }
    if (t.closest("#printBtn")) { try { window.print(); } catch (err) { toast("Printing isn’t available in this view."); } return; }

    if (t.closest("#importBtn")) { openImport(); return; }
    if (t.closest("#addPerson")) {
      var np = newPerson(""); P.people.unshift(np); search = ""; save(); renderVolunteers();
      var el = document.querySelector('[data-pid="' + np.id + '"] [data-f="name"]'); if (el) el.focus(); return;
    }
    var vol = t.closest(".vol");
    if (vol) {
      var p = personById(P, vol.getAttribute("data-pid"));
      var av = t.closest("[data-avail]"), ql = t.closest("[data-qual]");
      if (av && p) { var sid = av.getAttribute("data-avail"); p.avail[sid] = !p.avail[sid]; av.setAttribute("aria-pressed", String(!!p.avail[sid])); save(); return; }
      if (ql && p) { var gid = ql.getAttribute("data-qual"); p.quals[gid] = !p.quals[gid]; ql.setAttribute("aria-pressed", String(!!p.quals[gid])); save(); return; }
      if (t.closest("[data-remove]") && p) {
        var sn = snapshot();
        P.people = P.people.filter(function (x) { return x.id !== p.id; });
        Object.keys(P.assign).forEach(function (k) { if (P.assign[k] === p.id) delete P.assign[k]; });
        save(); renderVolList(); renderMeter(); toast("Removed " + (p.name || "volunteer") + ".", sn); return;
      }
    }

    // setup
    if (t.closest("#addShift")) {
      var n2 = P.shifts.length + 1;
      P.shifts.push(mkShift(uid(), "Shift " + n2, "", "", "Shift " + n2, "shift " + n2)); save(); renderSetup(); return;
    }
    var rs = t.closest("[data-rmshift]");
    if (rs) {
      var sid2 = rs.getAttribute("data-rmshift"), sn2 = snapshot();
      P.shifts = P.shifts.filter(function (s) { return s.id !== sid2; });
      Object.keys(P.assign).forEach(function (k) { if (k.indexOf(sid2 + "|") === 0) delete P.assign[k]; });
      save(); renderSetup(); renderMeter(); toast("Removed the shift.", sn2); return;
    }
    if (t.closest("#addPos")) { P.positions.push(mkPos(uid(), "New position", "stationary")); save(); renderSetup(); return; }
    var rp = t.closest("[data-rmpos]");
    if (rp) {
      var pid2 = rp.getAttribute("data-rmpos"), sn3 = snapshot();
      P.positions = P.positions.filter(function (x) { return x.id !== pid2; });
      Object.keys(P.assign).forEach(function (k) { if (k.split("|")[1] === pid2) delete P.assign[k]; });
      save(); renderSetup(); renderMeter(); toast("Removed the position.", sn3); return;
    }
    if (t.closest("#deleteProject")) {
      var btn = t.closest("#deleteProject");
      if (btn.getAttribute("data-sure") !== "1") { btn.setAttribute("data-sure", "1"); btn.textContent = "Click again to delete " + P.name; return; }
      var sn4 = snapshot();
      store.projects = store.projects.filter(function (x) { return x.id !== P.id; }); store.current = null; save(); render(); toast("Deleted the project.", sn4);
    }
  });

  app.addEventListener("change", function (e) {
    var t = e.target, P = cur();
    if (t.id === "restoreFile") {
      var f = t.files && t.files[0]; if (!f) return;
      f.text().then(function (txt) {
        try {
          var s = JSON.parse(txt);
          if (!s || !Array.isArray(s.projects)) throw new Error("bad");
          var snap = snapshot(); store = s; store.current = null; save(); render(); toast("Backup restored.", snap);
        } catch (err) { toast("That file isn’t a scheduler backup."); }
      });
      t.value = ""; return;
    }
    if (!P) return;
    var sel = t.closest("select[data-shift]");
    if (sel) {
      var s = P.shifts.filter(function (x) { return x.id === sel.getAttribute("data-shift"); })[0];
      var k = s.id + "|" + sel.getAttribute("data-pos");
      if (sel.value) P.assign[k] = sel.value; else delete P.assign[k];
      save(); var id = sel.id; renderAlerts(); renderShifts(); renderCounts(); renderMeter(); var again = document.getElementById(id); if (again) again.focus(); return;
    }
    var vol = t.closest(".vol");
    if (vol) {
      var p = personById(P, vol.getAttribute("data-pid")); if (!p) return;
      var f2 = t.getAttribute("data-f");
      if (f2 === "name") p.name = t.value.trim();
      else if (f2 === "notes") p.notes = t.value;
      else if (f2 === "partial") p.partial = t.value;
      else if (f2 === "willing") p.willing = t.value === "" ? null : Math.max(0, parseInt(t.value, 10) || 0);
      else if (t.hasAttribute("data-pref")) p.prefs[parseInt(t.getAttribute("data-pref"), 10)] = t.value;
      save(); return;
    }
    var projName = t.getAttribute("data-proj");
    if (projName === "name") { P.name = t.value.trim() || P.name; save(); var h = document.querySelector("header.top h1"); if (h) h.textContent = P.name; return; }
    var srow = t.closest("[data-sid]");
    if (srow && t.hasAttribute("data-sf")) {
      var sh = P.shifts.filter(function (x) { return x.id === srow.getAttribute("data-sid"); })[0];
      sh[t.getAttribute("data-sf")] = t.value.trim(); save(); return;
    }
    var prow = t.closest("[data-posid]");
    if (prow) {
      var pos = P.positions.filter(function (x) { return x.id === prow.getAttribute("data-posid"); })[0];
      if (t.hasAttribute("data-need")) {
        pos.need[t.getAttribute("data-need")] = t.checked;
        if (!t.checked) delete P.assign[t.getAttribute("data-need") + "|" + pos.id];
        save(); renderMeter();
      } else if (t.getAttribute("data-pf") === "name") { pos.name = t.value.trim() || pos.name; save(); }
      else if (t.getAttribute("data-pf") === "group") { pos.group = t.value || "stationary"; save(); }
    }
  });

  app.addEventListener("input", function (e) {
    if (e.target.id === "search") { search = e.target.value; renderVolList(); }
  });

  // modal events
  document.getElementById("modalRoot").addEventListener("click", function (e) {
    var t = e.target;
    if (t.id === "modalBack" || t.closest("[data-close]")) { closeModal(); return; }
    if (t.closest("#npCreate")) { createProject(); return; }
    if (t.closest("#readPaste")) {
      var v = document.getElementById("pasteBox").value;
      if (!v.trim()) { toast("Paste an email first."); return; }
      ingest([{ name: "Pasted text", text: v }]); return;
    }
    if (t.closest("#importMore")) {
      var keep = imp ? imp.drafts : [];
      openImport(); imp.drafts = keep; return;
    }
    if (t.closest("#applyImport")) { applyImport(); return; }
    if (!imp) return;
    var dEl = t.closest("[data-d]"); if (!dEl) return;
    var d = imp.drafts[parseInt(dEl.getAttribute("data-d"), 10)];
    var cs = t.closest("[data-dshift]"), cg = t.closest("[data-dgroup]");
    if (cs) { var sid = cs.getAttribute("data-dshift"); d.avail[sid] = !d.avail[sid]; cs.setAttribute("aria-pressed", String(!!d.avail[sid])); }
    if (cg) { var gid = cg.getAttribute("data-dgroup"); d.quals[gid] = !d.quals[gid]; cg.setAttribute("aria-pressed", String(!!d.quals[gid])); }
  });
  document.getElementById("modalRoot").addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "npCsv") {
      var cf = t.files && t.files[0], pv = document.getElementById("npPreview"); npCsv = null; if (!cf) return;
      cf.text().then(function (txt) {
        var dv = deriveFromCsv(txt);
        if (dv.error) { pv.textContent = "Can’t use this file: " + dv.error; return; }
        npCsv = { name: cf.name, text: txt };
        var nm = document.getElementById("npName"); if (nm && !nm.value.trim()) nm.value = cf.name.replace(/\.csv$/i, "").replace(/[_-]+/g, " ");
        pv.textContent = dv.count + " responses. Shifts: " + dv.shifts.map(function (x) { return x.short; }).join(", ") + ". Positions: " + dv.positions.map(function (x) { return x.name; }).join(", ") + ". Edit any of it on the Setup tab afterward.";
      });
      return;
    }
    if (t.id === "pickFiles") { if (t.files && t.files.length) readFiles(Array.prototype.slice.call(t.files)); t.value = ""; return; }
    if (!imp) return;
    var dEl = t.closest("[data-d]"); if (!dEl) return;
    var d = imp.drafts[parseInt(dEl.getAttribute("data-d"), 10)], f = t.getAttribute("data-df");
    if (f === "name") { d.name = t.value.trim(); t.classList.toggle("missing", !d.name); }
    else if (f === "notes") d.notes = t.value;
    else if (f === "partial") d.partial = t.value;
    else if (f === "willing") d.willing = t.value === "" ? null : Math.max(0, parseInt(t.value, 10) || 0);
    else if (f === "skip") { d.skip = t.checked; dEl.classList.toggle("skipped", d.skip); var b = document.getElementById("applyImport"); if (b) b.disabled = !imp.drafts.some(function (x) { return !x.skip; }); }
    else if (t.hasAttribute("data-dpref")) d.prefs[parseInt(t.getAttribute("data-dpref"), 10)] = t.value;
  });

  // new-project modal Enter key
  document.getElementById("modalRoot").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "npName") createProject();
  });

  /* ---- drag and drop anywhere on the page ---- */
  var dragN = 0, overlay = document.getElementById("dropOverlay");
  function dragHasData(e) { var ty = e.dataTransfer && e.dataTransfer.types; return !!ty && (Array.prototype.indexOf.call(ty, "Files") >= 0 || Array.prototype.indexOf.call(ty, "text/plain") >= 0); }
  window.addEventListener("dragenter", function (e) { if (!dragHasData(e)) return; e.preventDefault(); dragN++; if (cur()) overlay.hidden = false; });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function () { dragN = Math.max(0, dragN - 1); if (!dragN) overlay.hidden = true; });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); dragN = 0; overlay.hidden = true;
    if (!cur()) { toast("Open a project first, then drop the emails in."); return; }
    var dt = e.dataTransfer; if (!dt) return;
    if (dt.files && dt.files.length) { readFiles(Array.prototype.slice.call(dt.files)); return; }
    var txt = dt.getData("text/html") || dt.getData("text/plain");
    if (txt) ingest([{ name: "Dropped text", text: txt }]);
  });

  store = loadStore();
  render();
})();
</script>
</body>
</html>
